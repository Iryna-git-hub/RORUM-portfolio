# Runs the static checks on every push and pull request.
# No secrets are needed: unit tests set their own NEXT_PUBLIC_SITE_URL (vitest.setup.ts)
# and never call Sanity. `build` and Playwright are left out because they need real
# Sanity credentials and a running site.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
